    <text x="79" y="314" font-size="39" font-weight="450" letter-spacing="-1.5">Infection Journey</text>
    <text x="80" y="372" font-size="21" fill="#607984">Follow one simulated moment</text>
    <text x="80" y="405" font-size="21" fill="#607984">from the body to a single cell.</text>
