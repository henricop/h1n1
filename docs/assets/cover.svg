<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">H1N1 Infection Journey</title>
  <desc id="description">A clean anatomical illustration connects a human respiratory system to a magnified epithelial cell. Magenta particles trace a path from the nose into the airways.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fbfcfc"/><stop offset="1" stop-color="#e8f0f1"/></linearGradient>
    <radialGradient id="wash"><stop stop-color="#d7e7e5" stop-opacity=".8"/><stop offset="1" stop-color="#d7e7e5" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#e3eeef" stop-opacity=".7"/></linearGradient>
    <linearGradient id="lung" x2="1" y2="1"><stop stop-color="#a5d3d0" stop-opacity=".85"/><stop offset="1" stop-color="#4d9d99" stop-opacity=".66"/></linearGradient>
    <linearGradient id="airway" x2="1" y2="1"><stop stop-color="#1b817a"/><stop offset="1" stop-color="#75bcb8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#3b6870" flood-opacity=".12"/></filter>
    <clipPath id="lens"><circle cx="1330" cy="307" r="153"/></clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#abc8cb" opacity=".28"/></pattern>
  </defs>

