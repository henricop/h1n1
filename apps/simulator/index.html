<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f8" />
    <meta name="description" content="Explore a simulated infection from the human body to a cell in an interactive 3D anatomy atlas." />
    <title>H1N1 · Infection Journey</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var key = 'h1n1.lang';
        function norm(value) {
          if (!value) return '';
          var token = String(value).trim().toLowerCase();
          if (token === 'en' || token.indexOf('en-') === 0) return 'en';
          if (token === 'pt' || token.indexOf('pt-') === 0) return 'pt';
          return '';
        }
        var query = '';
        try { query = norm(new URLSearchParams(location.search).get('lang')); } catch (e) {}
        var stored = '';
        try { stored = norm(localStorage.getItem(key)); } catch (e) {}
        var lang = query || stored || 'en';
        var en = lang === 'en';
        document.documentElement.lang = en ? 'en' : 'pt-BR';
        document.title = en ? 'H1N1 · Infection Journey' : 'H1N1 · Jornada da Infecção';
        var meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', en
          ? 'Explore a simulated infection from the human body to a cell in an interactive 3D anatomy atlas.'
          : 'Explore a jornada de uma infecção simulada, do corpo humano à célula, em um atlas 3D interativo.');
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
